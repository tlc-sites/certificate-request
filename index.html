<style>
  :root {
    --p: #1a3150;
    --a: #bd8c48;
    --ink: #10243d;
    --text: #334155;
    --muted: #5b6878;
    --line: #dbe3ec;
    --soft: #f5f8fc;
    --tint: #eaf1f8;
    --rose: #be123c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 17px; line-height: 1.6; color: var(--ink);
    background: linear-gradient(180deg, #f5f8fc 0, #fff 380px);
    word-break: keep-all; overflow-wrap: anywhere;
  }
  body.admin-body { background: #f6f8fb; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  [hidden], .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 1.1em; height: 1.1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* 상단 */
  .topbar { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(26,49,80,.1); background: rgba(255,255,255,.93); backdrop-filter: blur(10px); }
  .topbar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; min-height: 72px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .brand-mark { width: 44px; height: 44px; border-radius: 13px; background: var(--p); color: #fff; display: grid; place-items: center; font-size: 22px; }
  .brand strong { display: block; font-size: 17px; line-height: 1.3; }
  .brand small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--muted); line-height: 1.3; }
  .top-badge { border-radius: 999px; background: var(--tint); color: var(--p); padding: 6px 13px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 0 13px; font-size: 15px; font-weight: 700; color: var(--p); text-decoration: none; cursor: pointer; }

  main { max-width: 1100px; margin: 0 auto; padding: 34px 16px 70px; }
  @media (min-width: 640px) { main { padding: 54px 28px 90px; } }
  .hero h1 { margin: 0; font-size: 38px; line-height: 1.2; letter-spacing: -.045em; color: var(--ink); }
  @media (min-width: 640px) { .hero h1 { font-size: 52px; } }
  .hero p { margin: 16px 0 0; max-width: 720px; font-size: 18px; line-height: 1.75; color: var(--muted); }

  .tabs { margin-top: 30px; display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04); width: 100%; max-width: 420px; }
  .tab { min-height: 50px; border: 0; border-radius: 14px; background: transparent; font-size: 17px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 0 12px; }
  .tab.on { background: var(--p); color: #fff; }

  .stepnav { margin-top: 34px; display: grid; grid-template-columns: repeat(3, 1fr); max-width: 620px; }
  .stepnav div { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 15px; font-weight: 700; color: #94a3b8; }
  .stepnav span { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; font-size: 14px; }
  .stepnav div:not(:last-child)::after { content: ""; position: absolute; top: 17px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 1px; background: var(--line); }
  .stepnav .on, .stepnav .done { color: var(--p); }
  .stepnav .on span { background: var(--p); border-color: var(--p); color: #fff; }
  .stepnav .done span { background: var(--tint); border-color: var(--p); color: var(--p); }

  .panel { margin-top: 30px; border: 1px solid var(--line); border-radius: 26px; background: #fff; padding: 24px 18px; box-shadow: 0 20px 55px rgba(20,45,72,.08); }
  @media (min-width: 640px) { .panel { padding: 40px; } }
  .sec-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 26px; }

  .info { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; border-radius: 14px; background: var(--soft); padding: 16px 18px; font-size: 16px; line-height: 1.7; color: var(--muted); }

  .done-box { text-align: center; padding: 50px 6px; }

  .receipt { margin: 22px auto 0; max-width: 420px; border: 1px solid #cbd8e5; border-radius: 16px; background: var(--soft); padding: 16px 20px; }
  .receipt span { display: block; font-size: 15px; color: var(--muted); }

  .receipt small { display: block; margin-top: 8px; font-size: 15px; line-height: 1.6; color: var(--muted); }

  .result { overflow: hidden; border: 1px solid #cbd8e5; border-radius: 18px; background: var(--soft); }
  .result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #cbd8e5; }
  .result-head small { display: block; font-size: 14px; color: var(--muted); }
  .result-head strong { font-size: 19px; }
  .pill { display: inline-block; border-radius: 999px; background: #fff; padding: 6px 13px; font-size: 15px; font-weight: 800; color: var(--p); box-shadow: 0 1px 3px rgba(0,0,0,.06); white-space: nowrap; }

  footer.foot { background: #10243d; color: #cbd5e1; padding: 34px 18px; }

  .foot strong { display: block; color: #fff; font-size: 16px; }

  .foot a.adm { font-size: 13px; color: #8693a4; text-decoration: none; }

  .loading { min-height: 60vh; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .spin { animation: spin 1s linear infinite; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px); border-radius: 14px; background: #10243d; color: #fff; padding: 13px 20px; font-size: 16px; font-weight: 700; box-shadow: 0 12px 30px rgba(0,0,0,.2); }

  /* 관리자 */
  .adm { max-width: 1100px; }
  .adm h1 { margin: 2px 0 0; font-size: 30px; letter-spacing: -.03em; }
  .adm .kicker { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .12em; color: var(--a); }
  .login { max-width: 440px; margin: 30px auto 0; }
  .filters { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 42px; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 0 15px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; }

  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 0; font-size: 16px; font-weight: 800; color: var(--p); cursor: pointer; }

  .box { margin-top: 18px; border-radius: 18px; padding: 18px; }

  .ok-msg { margin: 10px 0 0; font-size: 15px; font-weight: 700; color: var(--p); }
  .warn { margin: 10px 0 0; font-size: 15px; font-weight: 700; color: #9a5b00; }
  .fields { margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; }

  /* 출력 양식 */
  .print-bar { max-width: 210mm; margin: 0 auto 14px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-radius: 14px; background: #fff; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

  .print-bar small.need { color: #9a5b00; font-weight: 700; }
  .print-wrap { background: #e9edf2; padding: 18px 10px 40px; min-height: 100vh; overflow-x: auto; }
  .sheet { position: relative; margin: 0 auto; width: 210mm; min-height: 297mm; display: flex; flex-direction: column; background: #fff; padding: 16mm 19mm; color: #0f172a; box-shadow: 0 10px 30px rgba(0,0,0,.12); font-family: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif; word-break: keep-all; }

  /* 공문 (직접 발급) — 증명서 양식을 그대로 쓰고 본문만 덧붙입니다 */
  .sheet.letter .body.compact { margin-top: 7mm; }

  /* 관리자: 기관 공간 (주님의교회 / LEVITES MINISTRIES) */
  body.org-lm { --p: #1b1b1b; --a: #8c7b5f; --tint: #efefef; --soft: #f6f6f5; }
  body.org-lm.admin-body { background: #f5f5f4; }

  /* Direct letters share the same 172 x 275 mm content area on screen and paper. */

  .sheet.letter .lbody { margin-top: 4mm; font-size: 10pt; line-height: 1.5; }

  .sheet.letter .lbody h4 { margin: 2.2mm 0 .5mm; font-size: 10pt; }
  .sheet.letter .lbody ul { margin-bottom: 1mm; }
  .sheet.letter .lsign { margin-top: 4mm; }

    return textInput(name, { label: text.label, placeholder: text.placeholder || '예: 19560312' }, {

    });

  function optionSelect(def, text, options) {
    return '<label class="field' + (def.full ? ' full' : '') + '"><span>' + esc(text.label) + req(def.required) + '</span>' +
      '<select class="ctl" name="' + def.key + '"' + (def.required ? ' required' : '') + '><option value="">' + esc(S.common.selectPlaceholder) + '</option>' +
      lines(options).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select></label>';

  function dynamicField(def, text) {
    if (def.kind === 'textarea') {
      return '<label class="field' + (def.full ? ' full' : '') + '"><span>' + esc(text.label) + req(def.required) + '</span>' +
        '<textarea class="ctl" rows="4" name="' + def.key + '"' + (def.required ? ' required' : '') + ' placeholder="' + esc(text.placeholder) + '"></textarea></label>';
    }
    if (def.kind === 'taxYear') return optionSelect(def, text, S.options.taxYears);
    if (def.kind === 'issueType') return optionSelect(def, text, S.options.issueTypes);
    if (def.kind === 'donationPurpose') return optionSelect(def, text, S.options.donationPurposes);
    if (def.kind === 'resident') {
      return textInput(def.key, text, { required: true, full: def.full, type: 'password',
        attrs: ' inputmode="numeric" maxlength="14" pattern="[0-9]{6}-[0-9]{7}" autocomplete="off" data-resident="1" title="주민등록번호 13자리를 모두 입력해 주세요."' });
    }
    return textInput(def.key, text, { required: def.required, full: def.full, type: def.kind === 'date' ? 'date' : 'text' });
  }
  // 만 19세 미만인지 (생년월일 8자리)
  function isMinor(v) {
    var y = +v.slice(0, 4), m = +v.slice(4, 6), d = +v.slice(6, 8), t = new Date();
    var age = t.getFullYear() - y - ((t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) ? 1 : 0);
    return age >= 0 && age < 19;
  }
  function validBirth(v) {
    if (!/^\d{8}$/.test(v)) return false;
    var y = +v.slice(0, 4), m = +v.slice(4, 6), d = +v.slice(6, 8);
    var date = new Date(Date.UTC(y, m - 1, d));
    return y >= 1900 && date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
  }

  function buildReview() {
    var f = document.getElementById('s2');
    f.querySelectorAll('[data-birth]').forEach(function (inp) {
      inp.setCustomValidity(!inp.value || validBirth(inp.value) ? '' : '생년월일 8자리를 확인해 주세요. (예: 19560312)');
    });
    var sb = f.querySelector('[name=subjectBirthDate]');
    if (sb && !sb.disabled && sb.value && validBirth(sb.value) && !isMinor(sb.value)) sb.setCustomValidity(S.common.subjectAdultError);
    var en = f.querySelector('[name=englishName]');
    if (en) en.value = en.value.replace(/\s+/g, ' ').trim();
    if (!f.checkValidity()) {
      showErr('err2', S.validation.requiredFields);
      f.reportValidity();
      return;
    }
    var data = new FormData(f);
    var delivery = data.get('deliveryMethod');
    if (delivery === 'email' && String(data.get('email')).trim().toLowerCase() !== String(data.get('emailConfirm')).trim().toLowerCase()) {
      showErr('err2', S.validation.emailMismatch); return;
    }
    document.getElementById('err2').classList.add('hidden');
    var isDonation = P.docType === 'donation', doc = S.documents[P.docType], c = S.common;
    var deliveryLabels = { email: S.delivery.email, visit: S.delivery.visit, direct: S.delivery.direct };
    var g = function (k) { return String(data.get(k) || '').trim(); };
    var guardian = g('applicantRelation') === 'guardian';
    var lang = g('certificateLanguage') === 'en' ? 'en' : 'ko';
    var rows = [
      [c.applicantName.label, g('applicantName')],
      [c.phone.label, g('phone')],
      [c.department.label, g('affiliatedDepartment') || '-'],
      [c.relation.label, guardian ? c.relationGuardian : c.relationSelf]
    ];
    if (guardian) rows.push([c.subjectName.label, g('subjectName')], [c.subjectBirthDate.label, koDate(g('subjectBirthDate'))]);
    if (!isDonation) {
      rows.push([S.language.title, lang === 'en' ? S.language.en : S.language.ko]);
      if (lang === 'en') rows.push([S.language.englishNameLabel, g('englishName')]);
    }
    rows = rows.concat([
      [S.delivery.title, deliveryLabels[delivery] || '-'],
      [S.delivery.requestedDateLabel, g('requestedDate') ? koDate(g('requestedDate')) : S.delivery.requestedDateFallback],
      [S.delivery.copiesLabel, g('copies') || '-']
    ]);
    if (!isDonation) rows.splice(1, 0, [c.birthDate.label, koDate(g('birthDate'))]);
    if (isDonation) {
      var rn = g('residentNumber');
      rows.splice(3, 0,
        [doc.fields.donorName.label, g('donorName') || '-'],
        [doc.fields.residentNumber.label, rn ? rn.slice(0, 8) + '******' : '-'],
        [doc.fields.registeredAddress.label, g('registeredAddress') || '-']);
    }
    if (delivery === 'email') rows.push([S.delivery.emailLabel, g('email')]);
    if (delivery === 'direct') rows.push([S.delivery.organizationLabel, g('recipientOrganization')], [S.delivery.recipientEmailLabel, g('recipientEmail')]);
    if (P.file) rows.push([S.attachment.title, P.file.name]);

    var values = { documentType: P.docType };
    data.forEach(function (v, k) {
      if (typeof v === 'string' && k !== 'emailConfirm' && !/Consent$/.test(k)) values[k] = v.trim();
    });
    values.privacyConsent = !!f.querySelector('[name=privacyConsent]').checked;
    if (isDonation) values.sensitiveConsent = !!f.querySelector('[name=sensitiveConsent]').checked;
    P.values = values;

    var s3 = document.getElementById('s3');
    s3.innerHTML = secHead('03', S.review.title, S.review.description) +
      '<div class="review-box"><div class="review-top"><small>' + esc(doc.name) + '</small><strong>' + esc(S.intro.title) + '</strong></div>' +
      '<div class="kv">' + rows.map(function (r) { return '<div><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div></div>' +
      '<div class="info"><strong>' + esc(S.review.noticeTitle) + '</strong><span>' + esc(S.review.noticeBody) + '</span></div>' +
      '<p class="err hidden" id="err3" role="alert"></p>' +
      '<div class="btn-row"><button type="button" class="btn ghost" id="back2">' + esc(S.review.backButton) + '</button>' +
      '<button type="button" class="btn" id="submitBtn">' + esc(S.review.submitButton) + '</button></div>';
    document.getElementById('back2').addEventListener('click', function () { if (!P.submitting) goStep(2); });
    document.getElementById('submitBtn').addEventListener('click', submit);
    goStep(3);
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { resolve(null); return; }
      var r = new FileReader();
      r.onload = function () { resolve({ name: file.name, data: r.result }); };
      r.onerror = function () { reject(new Error('첨부파일을 읽지 못했습니다. 다른 파일로 다시 시도해 주세요.')); };
      r.readAsDataURL(file);
    });
  }

  function submit() {
    if (P.submitting) return;
    P.submitting = true;
    var btn = document.getElementById('submitBtn'), back = document.getElementById('back2');
    btn.disabled = true; back.disabled = true;
    btn.innerHTML = icon('loader', 'spin') + ' 접수 중입니다…';
    document.getElementById('err3').classList.add('hidden');
    readFile(P.file).then(function (att) {
      return run('submitApplication', P.values, att);
    }).then(function (res) {
      P.submitting = false;
      var s4 = document.getElementById('s4');
      s4.innerHTML = '<div class="done-box"><div class="done-icon">' + icon('check') + '</div>' +
        '<p class="eyebrow">' + esc(S.success.eyebrow) + '</p><h2>' + esc(S.success.title) + '</h2>' +
        '<p class="desc">' + esc(S.success.description) + '</p>' +
        '<div class="receipt"><span>신청 내역 확인용 접수번호</span><b>' + esc(res.reference) + '</b>' +
        '<small>접수번호와 신청할 때 적은 휴대전화번호로 처리 상태를 확인하실 수 있습니다.</small></div>' +
        '<div class="btn-row end" style="justify-content:center"><button type="button" class="btn ghost" id="again">' + esc(S.success.resetButton) + '</button></div></div>';
      document.getElementById('again').addEventListener('click', resetAll);
      goStep(4);
    }).catch(function (err) {
      P.submitting = false;
      btn.disabled = false; back.disabled = false;
      btn.textContent = S.review.submitButton;
      showErr('err3', err.message || '신청을 접수하지 못했습니다.');
    });
  }

  function resetAll() {
    P = { step: 1, docType: '', builtFor: '', file: null, values: null, submitting: false };
    document.getElementById('s2').innerHTML = '';
    root.querySelectorAll('.doc').forEach(function (el) { el.classList.remove('on'); el.querySelector('input').checked = false; });
    goStep(1);
    scrollTop();
  }

  // ── 신청 내역 조회 ─────────────────────────────

        '<label class="field full"><span>접수번호 <small style="font-weight:400;color:var(--muted)">선택</small></span><input class="ctl" name="receiptCode" autocomplete="off" maxlength="14" placeholder="알고 계신 경우에만 입력해 주세요" style="text-transform:uppercase"></label>' +
        '<p class="err hidden full" id="errL" role="alert" style="margin:0"></p>' +

          '<div style="display:grid;gap:14px">' + res.applications.map(function (a) {
            return '<div class="result"><div class="result-head"><div><small>신청 문서</small><strong>' + esc(a.documentName) + '</strong></div><span class="pill">' + esc(a.statusLabel) + '</span></div>' +

                .map(function (r) { return '<div><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div></div>';
          }).join('') + '</div><p class="help" style="margin-top:14px;font-size:15px">개인정보 보호를 위해 신청 상세 내용과 발급 문서는 이 화면에 표시하지 않습니다.</p></div>';

  // ═════════════════════════════════════════════
  // 관리자 화면
  // ═════════════════════════════════════════════
  var A = { token: '', list: [], statuses: [], sheetUrl: '', settings: null, filter: '전체', query: '', detail: null, view: 'apps',
    ledger: [], ledgerIssuer: '전체', ledgerCat: '전체', ledgerQuery: '', direct: [], doc: null };
  var REC_TYPES = ['seniorPastor', 'minister', 'memberRecommendation'];
  var CER_TYPES = ['dedication', 'baptism'];

  function adminInput(key, label, value, type, hint) {
    return '<label class="field"><span>' + esc(label) + '</span><input class="ctl" id="iss_' + key + '" type="' + type + '" value="' + esc(value || '') + '">' +
      (hint ? '<small style="font-weight:400;color:var(--muted)">' + esc(hint) + '</small>' : '') + '</label>';
  }

  function getToken() { try { return sessionStorage.getItem('cert_admin_token') || ''; } catch (e) { return ''; } }
  function setToken(t) { try { if (t) sessionStorage.setItem('cert_admin_token', t); else sessionStorage.removeItem('cert_admin_token'); } catch (e) {} }

  // 주님의교회 / LEVITES MINISTRIES 는 따로 보이는 공간입니다 (도구와 발급대장 시트는 함께 씁니다)
  function getOrg() { try { return sessionStorage.getItem('cert_admin_org') === 'lm' ? 'lm' : 'tlc'; } catch (e) { return 'tlc'; } }
  function setOrg(o) { A.org = o; try { sessionStorage.setItem('cert_admin_org', o); } catch (e) {} document.body.classList.toggle('org-lm', o === 'lm'); }
  function adminBrand() {
    if (A.org === 'lm') {
      var lm = S.issuers.lm;
      return '<a class="brand" href="' + esc(BOOT.baseUrl) + '?admin=1"><span class="brand-mark lm"><img src="' + LM_LOGO + '" alt=""></span>' +
        '<span><strong>' + esc(lm.name) + '</strong><small>문서 발급 관리</small></span></a>';
    }
    return brandHtml('증명서 신청 관리', BOOT.baseUrl + '?admin=1');
  }
  function adminShell(inner) {
    return '<header class="topbar no-print"><div class="topbar-in">' + adminBrand() +
      '<div class="top-actions">' + (A.org === 'lm' ? '' : '<a class="icon-btn" href="' + esc(BOOT.baseUrl) + '">' + icon('external') + '<span>신청 화면</span></a>') +
      (A.token ? '<button type="button" class="icon-btn" id="logoutBtn" aria-label="로그아웃">' + icon('logout') + '</button>' : '') +
      '</div></div></header><main class="adm">' + (A.token ? orgSwitch() + adminNav() : '') + inner + '</main>';
  }
  function orgSwitch() {
    return '<div class="org-switch no-print" role="tablist" aria-label="기관 선택">' + [['tlc', LOGO, S.issuers.tlc.name], ['lm', LM_LOGO, S.issuers.lm.name]].map(function (o) {
      return '<button type="button" role="tab" class="' + (A.org === o[0] ? 'on' : '') + '" data-org="' + o[0] + '" aria-selected="' + (A.org === o[0]) + '">' +
        '<img src="' + o[1] + '" alt="">' + esc(o[2]) + '</button>';
    }).join('') + '</div>';
  }
  function adminNav() {
    var items = A.org === 'lm' ? [['ledger', '발급대장'], ['direct', '직접 발급']] : [['apps', '신청 관리'], ['ledger', '발급대장'], ['direct', '직접 발급']];
    return '<nav class="adm-nav no-print" aria-label="관리 메뉴">' + items.map(function (v) {
      return '<button type="button" class="' + (A.view === v[0] ? 'on' : '') + '" data-view="' + v[0] + '">' + v[1] + '</button>';
    }).join('') + '</nav>';
  }
  function goView(v) {
    if (A.org === 'lm' && v === 'apps') v = 'ledger';
    A.view = v; scrollTop();
    if (v === 'ledger') loadLedger(); else if (v === 'direct') loadDirect(); else loadList();
  }
  function bindLogout() {
    root.querySelectorAll('.adm-nav [data-view]').forEach(function (b) {
      b.addEventListener('click', function () { goView(b.getAttribute('data-view')); });
    });
    root.querySelectorAll('.org-switch [data-org]').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = b.getAttribute('data-org');
        if (o === A.org) return;
        setOrg(o);
        goView(o === 'lm' && A.view === 'apps' ? 'ledger' : A.view);
      });
    });
    var b = document.getElementById('logoutBtn');
    if (b) b.addEventListener('click', function () {
      run('adminLogout', A.token).catch(function () {});
      A.token = ''; setToken('');
      renderLogin();
    });
  }
  function handleAdminError(err) {
    if (String(err.message) === 'LOGIN_REQUIRED') {
      A.token = ''; setToken('');
      renderLogin('로그인 시간이 지났습니다. 비밀번호를 다시 입력해 주세요.');
      return true;
    }
    toast(err.message);
    return false;
  }

  function startAdmin() {
    document.body.classList.add('admin-body');
    document.title = '증명서 신청 관리 | ' + S.brand.churchName;
    A.token = getToken();
    setOrg(getOrg());
    if (!A.token) { renderLogin(); return; }
    // 신청 목록에서 화면 설정을 받아 오므로 먼저 불러온 뒤 리바이츠 공간이면 발급대장으로 갑니다
    if (A.org === 'lm') { run('adminList', A.token).then(function (res) { A.settings = res.settings; A.statuses = res.statuses; goView('ledger'); }).catch(function (err) { handleAdminError(err); }); }
    else loadList();
  }

  function renderLogin(msg) {
    root.innerHTML = adminShell(
      '<section class="panel login"><p class="kicker">ADMIN</p><h1 style="margin:4px 0 6px;font-size:28px">관리자 로그인</h1>' +
      '<p class="help" style="margin:0 0 20px">접수된 증명서 신청을 확인하려면 관리자 비밀번호를 입력해 주세요.</p>' +
      '<form id="loginForm"><label class="field"><span>비밀번호</span><input class="ctl" type="password" name="pw" required autocomplete="current-password"></label>' +
      '<p class="err' + (msg ? '' : ' hidden') + '" id="errLogin" role="alert">' + esc(msg || '') + '</p>' +
      '<button class="btn" style="width:100%;margin-top:18px" id="loginBtn">' + icon('lock') + ' 로그인</button></form></section>');
    var form = document.getElementById('loginForm');
    form.pw.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      run('adminLogin', form.pw.value).then(function (res) {
        A.token = res.token; setToken(res.token);
        if (A.org === 'lm') { run('adminList', A.token).then(function (r2) { A.settings = r2.settings; A.statuses = r2.statuses; goView('ledger'); }).catch(handleAdminError); }
        else loadList();
      }).catch(function (err) {
        btn.disabled = false;
        showErr('errLogin', err.message);
      });
    });
  }

  function loadList() {
    if (A.org === 'lm') setOrg('tlc');
    A.view = 'apps';
    root.innerHTML = adminShell('<div class="loading">' + icon('loader', 'spin') + '&nbsp;신청 목록을 불러오는 중입니다…</div>');
    run('adminList', A.token).then(function (res) {
      A.list = res.applications; A.statuses = res.statuses; A.sheetUrl = res.sheetUrl; A.settings = res.settings;
      renderList();
    }).catch(function (err) { if (!handleAdminError(err)) renderList(); });
  }

  function stClass(status) { return 's' + (A.statuses.indexOf(status) + 1); }

  function renderList() {
    var counts = {};
    A.list.forEach(function (a) { counts[a.status] = (counts[a.status] || 0) + 1; });
    var chips = ['전체'].concat(A.statuses).map(function (s) {
      var n = s === '전체' ? A.list.length : (counts[s] || 0);
      return '<button type="button" class="chip' + (A.filter === s ? ' on' : '') + '" data-f="' + esc(s) + '">' + esc(s) + ' ' + n + '</button>';
    }).join('');
    root.innerHTML = adminShell(
      '<div class="detail-head"><div><p class="kicker">APPLICATIONS</p><h1>접수된 신청</h1></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost small" id="reload">' + icon('refresh') + ' 새로고침</button>' +
      (A.sheetUrl ? '<a class="btn ghost small" href="' + esc(A.sheetUrl) + '" target="_blank" rel="noopener">' + icon('sheet') + ' 시트 열기</a>' : '') + '</div></div>' +
      '<div class="filters">' + chips + '</div>' +
      '<input class="ctl search" id="q" placeholder="이름, 접수번호, 문서로 찾기" value="' + esc(A.query) + '">' +
      '<div class="list" id="list"></div>');
    bindLogout();
    document.getElementById('reload').addEventListener('click', loadList);
    root.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () { A.filter = b.getAttribute('data-f'); renderList(); });
    });
    var q = document.getElementById('q');
    q.addEventListener('input', function () { A.query = q.value; drawItems(); });
    drawItems();
  }

  function drawItems() {
    var q = A.query.trim().toLowerCase();
    var items = A.list.filter(function (a) {
      if (A.filter !== '전체' && a.status !== A.filter) return false;
      if (!q) return true;
      return (a.applicantName + ' ' + a.reference + ' ' + a.documentName).toLowerCase().indexOf(q) >= 0;
    });
    var box = document.getElementById('list');
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + (A.list.length ? '조건에 맞는 신청이 없습니다.' : '아직 접수된 신청이 없습니다.') + '</div>';
      return;
    }
    box.innerHTML = items.map(function (a) {
      return '<button type="button" class="item" data-ref="' + esc(a.reference) + '"><span><strong>' + esc(a.documentName) + ' · ' + esc(a.applicantName) + '</strong>' +
        '<small>' + esc(a.dateLabel) + ' 접수 · ' + esc(a.reference) + (a.requestedDate ? ' · 희망일 ' + esc(koDate(a.requestedDate)) : '') + '</small></span>' +
        '<span class="st ' + stClass(a.status) + '">' + esc(a.status) + '</span></button>';
    }).join('');
    box.querySelectorAll('.item').forEach(function (b) {
      b.addEventListener('click', function () { openDetail(b.getAttribute('data-ref')); });
    });
  }

  function openDetail(ref) {
    root.innerHTML = adminShell('<div class="loading">' + icon('loader', 'spin') + '&nbsp;신청 내용을 불러오는 중입니다…</div>');
    scrollTop();
    run('adminDetail', A.token, ref).then(function (d) {
      A.detail = d;
      renderDetail();
    }).catch(function (err) { if (!handleAdminError(err)) renderList(); });
  }

  function renderDetail() {
    var d = A.detail, p = d.payload, type = p.documentType;
    var isRec = REC_TYPES.indexOf(type) >= 0, isDon = type === 'donation';
    var hidden = { documentType: 1, recommendationBody: 1, donationAmount: 1, donationPeriod: 1, donationType: 1, confirmedStart: 1, confirmedDate: 1, officiant: 1, en: 1 };
    var relLabels = { self: S.common.relationSelf, guardian: S.common.relationGuardian, family: '가족', staff: '교역자가 대신 신청', other: '기타' };
    var isEn = p.certificateLanguage === 'en', isCer = CER_TYPES.indexOf(type) >= 0;
    var delLabels = { email: S.delivery.email, visit: S.delivery.visit, direct: S.delivery.direct };
    var shown = function (k, v) {
      if (k === 'applicantRelation') return relLabels[v] || v;
      if (k === 'deliveryMethod') return delLabels[v] || v;
      if (k === 'certificateLanguage') return v === 'en' ? S.language.en : S.language.ko;
      if (/Date$|^deadline$|^employment(Start|End)$|^attendanceStart$/.test(k)) return koDate(v);
      return v;
    };
    var cells = '';
    if (isDon) {
      cells += '<div><span>주민등록번호</span><b><span id="rrnVal">' + esc(d.residentMasked) + '</span>' +
        (d.residentMasked !== '삭제됨' ? '<button type="button" class="mini" id="rrnBtn">전체 보기</button>' : '') + '</b></div>';
    }
    Object.keys(p).forEach(function (k) {
      if (hidden[k] || !p[k] || !d.labels[k]) return;
      cells += '<div><span>' + esc(d.labels[k]) + '</span><b>' + esc(shown(k, p[k])) + '</b></div>';
    });

    // ── 발급 문서 작성 (관리자가 확인해 적는 내용) ──

      parts.push('<div class="grid2">' + adminInput('confirmedStart', '확인된 출석 시작일', p.confirmedStart, 'date',

    }
    if (isCer) {
      parts.push('<div class="grid2">' +
        adminInput('confirmedDate', '확인된 ' + (type === 'baptism' ? '침례일' : '헌아일'), p.confirmedDate, 'date', '신청자가 적은 시기: ' + (p.ceremonyTime || '-')) +
        adminInput('officiant', '집례자', p.officiant, 'text', '예: 스캇 브래너 목사') + '</div>');
    }
    if (isRec) {
      parts.push('<label class="field"><span>추천서 본문' + (isEn ? ' (영어로 작성해 주세요)' : '') + '</span><textarea class="ctl" id="iss_recommendationBody" rows="10" placeholder="추천 대상자의 신앙생활, 성품, 사역 및 추천 사유를 작성해 주세요.">' + esc(p.recommendationBody || '') + '</textarea></label>');
    }
    if (isDon) {
      parts.push('<div class="grid2">' +
        '<label class="field"><span>기부 기간</span><input class="ctl" id="iss_donationPeriod" placeholder="예: 2026. 1. 1. ~ 2026. 12. 31." value="' + esc(p.donationPeriod || '') + '"></label>' +
        '<label class="field"><span>확인된 기부금액 (숫자만)</span><input class="ctl" id="iss_donationAmount" inputmode="numeric" placeholder="예: 1200000" value="' + esc(p.donationAmount || '') + '"></label>' +
        '<label class="field full"><span>기부금 유형</span><input class="ctl" id="iss_donationType" value="' + esc(p.donationType || '종교단체 기부금') + '"></label></div>');
    }
    if (isEn && !isDon) {
      var need = enNeeds(type, p, A.settings);
      parts.push('<div class="en-box"><h3>영문 발급 내용</h3><p class="sub">영문 증명서에 들어갈 내용을 영어로 옮겨 적어 주세요. 이름·날짜는 자동으로 영어로 바뀝니다.</p>' +
        (need.length ? '<div class="grid2">' + need.map(function (n) {
          return '<label class="field' + (n.full ? ' full' : '') + '"><span>' + esc(n.label) + '</span><input class="ctl" data-en="' + n.key + '" value="' + esc((p.en || {})[n.key] || '') + '" placeholder="' + esc(n.hint) + '"></label>';
        }).join('') + '</div>' : '<p class="sub">옮겨 적을 항목이 없습니다.</p>') + '</div>');
    }
    var issuance = parts.length ? '<section class="box gold"><h2>발급 문서 작성</h2><p class="sub">신청자가 작성한 정보와 교회 기록을 확인한 뒤 최종 문서에 들어갈 내용을 입력해 주세요.</p>' +
      '<div style="display:grid;gap:18px;margin-top:14px">' + parts.join('') + '</div>' +
      '<div style="margin-top:14px"><button type="button" class="btn small" id="saveIss">발급 정보 저장</button></div><p class="ok-msg hidden" id="issMsg"></p></section>' : '';

    root.innerHTML = adminShell(
      '<button type="button" class="back" id="toList">' + icon('left') + ' 신청 목록</button>' +
      '<section class="panel" style="margin-top:10px">' +
        '<div class="detail-head"><div><p class="kicker">접수 ' + esc(d.reference) + '</p><h1>' + esc(d.documentName) + '</h1>' +
        '<p class="help" style="margin:6px 0 0">' + esc(d.dateLabel) + ' 접수' + (d.documentNumber ? ' · 문서번호 ' + esc(d.documentNumber) : '') + '</p></div>' +
        '<button type="button" class="btn small" id="toPrint">' + icon('printer') + ' 출력 양식 미리보기</button></div>' +
        '<section class="box blue"><h2>처리 상태</h2><p class="sub">저장하면 성도의 신청 내역 조회 화면에 바로 반영됩니다.</p>' +
          '<div class="row-ctl"><select class="ctl" id="stSel">' + A.statuses.map(function (s) {
            return '<option' + (s === d.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>' +
          '<button type="button" class="btn small" id="stSave" disabled>상태 저장</button></div>' +
          (isDon && d.residentMasked !== '삭제됨' ? '<p class="warn">“발급 완료”로 저장하면 주민등록번호가 바로 삭제됩니다. 영수증을 먼저 인쇄하거나 PDF로 저장해 주세요.</p>' : '') +
          '<p class="ok-msg hidden" id="stMsg"></p></section>' +
        issuance +
        '<div class="fields"><div class="kv">' + cells + '</div></div>' +
        (d.hasAttachment ? '<div style="margin-top:16px"><button type="button" class="btn ghost small" id="attBtn">' + icon('download') + ' 첨부파일 받기 (' + esc(p.templateFileName || '파일') + ')</button></div>' : '') +
      '</section>');
    bindLogout();
    document.getElementById('toList').addEventListener('click', function () { loadList(); scrollTop(); });
    document.getElementById('toPrint').addEventListener('click', renderPrint);

    var sel = document.getElementById('stSel'), save = document.getElementById('stSave');
    sel.addEventListener('change', function () { save.disabled = sel.value === d.status; });
    save.addEventListener('click', function () {
      save.disabled = true; save.textContent = '저장 중…';
      run('adminUpdateStatus', A.token, d.reference, sel.value).then(function (res) {
        d.status = sel.value;
        if (res.documentNumber) { d.documentNumber = res.documentNumber; d.issuedAt = res.issuedAt; }
        A.list.forEach(function (a) { if (a.reference === d.reference) a.status = sel.value; });
        if (res.residentDeleted) { d.residentMasked = '삭제됨'; renderDetail(); toast('처리 상태를 저장했고, 주민등록번호를 삭제했습니다.'); return; }
        save.textContent = '상태 저장';
        var m = document.getElementById('stMsg');
        m.textContent = res.documentNumber ? '발급 완료로 저장했습니다. 문서번호 ' + res.documentNumber + '가 발급대장에 기록되었습니다.' : '처리 상태를 저장했습니다.';
        m.classList.remove('hidden');
      }).catch(function (err) {
        save.disabled = false; save.textContent = '상태 저장';
        handleAdminError(err);
      });
    });

    var iss = document.getElementById('saveIss');
    if (iss) iss.addEventListener('click', function () {
      var body = {};
      root.querySelectorAll('[id^="iss_"]').forEach(function (el) { body[el.id.slice(4)] = el.value.trim(); });
      if (body.donationAmount !== undefined) body.donationAmount = body.donationAmount.replace(/[^0-9]/g, '');
      var enInputs = root.querySelectorAll('[data-en]');
      if (enInputs.length) {
        body.en = {};
        enInputs.forEach(function (el) { if (el.value.trim()) body.en[el.getAttribute('data-en')] = el.value.trim(); });
      }
      iss.disabled = true; iss.textContent = '저장 중…';
      run('adminSaveIssuance', A.token, d.reference, body).then(function () {
        Object.keys(body).forEach(function (k) { p[k] = body[k]; });
        var m = document.getElementById('issMsg'); m.textContent = '발급 정보를 저장했습니다. 출력 양식에도 반영됩니다.'; m.classList.remove('hidden');
      }).catch(handleAdminError).then(function () { iss.disabled = false; iss.textContent = '발급 정보 저장'; });
    });

    var rb = document.getElementById('rrnBtn');
    if (rb) rb.addEventListener('click', function () {
      var val = document.getElementById('rrnVal');
      if (rb.getAttribute('data-on') === '1') { val.textContent = d.residentMasked; rb.textContent = '전체 보기'; rb.removeAttribute('data-on'); return; }
      rb.disabled = true;
      run('adminRevealResident', A.token, d.reference).then(function (res) {
        if (res.deleted) { val.textContent = '삭제됨'; rb.remove(); return; }
        val.textContent = res.residentNumber; rb.textContent = '가리기'; rb.setAttribute('data-on', '1');
      }).catch(handleAdminError).then(function () { rb.disabled = false; });
    });

    var ab = document.getElementById('attBtn');
    if (ab) ab.addEventListener('click', function () {
      ab.disabled = true;
      run('adminAttachment', A.token, d.reference).then(function (res) {
        var a = document.createElement('a');
        a.href = res.dataUrl; a.download = res.name;
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(handleAdminError).then(function () { ab.disabled = false; });
    });
  }

  // ═════════════════════════════════════════════
  // 발급대장 (주님의교회 · LEVITES MINISTRIES 공식 문서)
  // ═════════════════════════════════════════════
  function loadLedger() {
    A.view = 'ledger';
    root.innerHTML = adminShell('<div class="loading">' + icon('loader', 'spin') + '&nbsp;발급대장을 불러오는 중입니다…</div>');
    run('adminLedger', A.token).then(function (res) {
      A.ledger = res.rows; A.ledgerCats = res.categories; A.sheetUrl = res.sheetUrl || A.sheetUrl;
      renderLedger();
    }).catch(function (err) { if (!handleAdminError(err)) { A.ledger = []; renderLedger(); } });
  }

  function issuerName(key) { return (S.issuers[key] || {}).name || key; }

  function renderLedger() {
    var cats = ['전체'].concat(A.ledgerCats || ['증명서', '추천서', '승인서', '공문', '기타']);
    root.innerHTML = adminShell(
      '<div class="detail-head"><div><p class="kicker">' + esc(issuerName(A.org)) + '</p><h1>발급대장</h1>' +
      '<p class="help" style="margin:6px 0 0">' + esc(issuerName(A.org)) + ' 이름으로 발급한 문서가 문서번호(' + (A.org === 'lm' ? 'LM' : 'TLC') + '-연도-번호) 순서대로 기록됩니다.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost small" id="reload">' + icon('refresh') + ' 새로고침</button>' +
      (A.sheetUrl ? '<a class="btn ghost small" href="' + esc(A.sheetUrl) + '" target="_blank" rel="noopener">' + icon('sheet') + ' 시트 열기</a>' : '') + '</div></div>' +
      '<div class="filters">' + cats.map(function (c) {
        return '<button type="button" class="chip' + (A.ledgerCat === c ? ' on' : '') + '" data-lc="' + esc(c) + '">' + esc(c === '전체' ? '모든 구분' : c) + '</button>';
      }).join('') + '</div>' +
      '<input class="ctl search" id="lq" placeholder="문서번호, 문서명, 수신·대상으로 찾기" value="' + esc(A.ledgerQuery) + '">' +
      '<div class="list" id="llist"></div>');
    bindLogout();
    document.getElementById('reload').addEventListener('click', loadLedger);
    root.querySelectorAll('[data-lc]').forEach(function (b) { b.addEventListener('click', function () { A.ledgerCat = b.getAttribute('data-lc'); renderLedger(); }); });
    var q = document.getElementById('lq');
    q.addEventListener('input', function () { A.ledgerQuery = q.value; drawLedgerItems(); });
    drawLedgerItems();
  }

  function drawLedgerItems() {
    var q = A.ledgerQuery.trim().toLowerCase();
    var rows = A.ledger.filter(function (r) {
      if (r.issuerKey !== A.org) return false;
      if (A.ledgerCat !== '전체' && r.category !== A.ledgerCat) return false;
      return !q || (r.number + ' ' + r.title + ' ' + r.recipient + ' ' + r.source).toLowerCase().indexOf(q) >= 0;
    });
    var box = document.getElementById('llist');
    if (!rows.length) {
      var any = A.ledger.some(function (r) { return r.issuerKey === A.org; });
      box.innerHTML = '<div class="empty">' + (any ? '조건에 맞는 문서가 없습니다.' : '아직 ' + esc(issuerName(A.org)) + ' 이름으로 발급된 문서가 없습니다.') + '</div>';
      return;
    }
    box.innerHTML = rows.map(function (r) {
      var cancelled = r.status === '취소';
      return '<button type="button" class="item' + (cancelled ? ' void' : '') + '" data-no="' + esc(r.number) + '"><span>' +
        '<strong><span class="docno">' + esc(r.number) + '</span> ' + esc(r.title) + '</strong>' +
        '<small>' + esc(r.date) + ' · ' + esc(r.category) + ' · ' + esc(r.recipient || '-') + '</small></span>' +
        '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">' +
        (r.hasFile ? '<span class="st s1">PDF</span>' : '') +
        '<span class="st ' + (cancelled ? 's3' : 's5') + '">' + esc(r.status) + '</span></span></button>';
    }).join('');
    box.querySelectorAll('[data-no]').forEach(function (b) {
      b.addEventListener('click', function () { renderLedgerDetail(b.getAttribute('data-no')); });
    });
  }

  function renderLedgerDetail(number) {
    var r = A.ledger.filter(function (x) { return x.number === number; })[0];
    if (!r) { renderLedger(); return; }
    var cancelled = r.status === '취소';
    var cells = [['문서번호', r.number], ['발급일', r.date], ['발급 주체', r.issuer], ['구분', r.category], ['문서명', r.title],
      ['수신·발급 대상', r.recipient], ['대표자', r.rep], ['상태', r.status], [r.sourceType === 'direct' ? '문서 ID' : '접수번호', r.source],
      ['발급 언어', r.lang], ['유효기한', r.validUntil], ['비고', r.note]]
      .filter(function (c) { return c[1]; })
      .map(function (c) { return '<div><span>' + esc(c[0]) + '</span><b>' + esc(c[1]) + '</b></div>'; }).join('');
    root.innerHTML = adminShell(
      '<button type="button" class="back" id="toLedger">' + icon('left') + ' 발급대장</button>' +
      '<section class="panel" style="margin-top:10px">' +
        '<div class="detail-head"><div><p class="kicker">' + esc(r.issuer) + ' · ' + esc(r.category) + '</p><h1>' + esc(r.title) + '</h1>' +
        '<p class="help" style="margin:6px 0 0">' + esc(r.number) + ' · ' + esc(r.date) + ' 발급</p></div>' +
        (r.source ? '<button type="button" class="btn small" id="openSrc">' + icon('printer') + ' 문서 보기·인쇄</button>' : '') + '</div>' +
        '<section class="box blue"><h2>발급본 PDF</h2><p class="sub">인쇄 화면에서 PDF로 저장한 파일을 올리면 드라이브 문서 폴더에 정리되고 이곳에서 다시 받을 수 있습니다.</p>' +
          '<div class="row-ctl" style="flex-wrap:wrap">' + (r.hasFile ? '<button type="button" class="btn ghost small" id="getPdf">' + icon('download') + ' PDF 받기</button>' : '') +
          pdfUploadButton(r.hasFile) + '</div><p class="ok-msg hidden" id="printMsg"></p></section>' +
        '<div class="fields"><div class="kv">' + cells + '</div></div>' +
        (cancelled ? '' :
          '<section class="box" style="border:1px solid #f3c7d0;background:#fff7f8"><h2>발급 취소</h2>' +
          '<p class="sub">잘못 발급한 문서는 지우지 않고 취소로 남깁니다. 문서번호는 다시 쓰지 않습니다.</p>' +
          '<div class="row-ctl"><input class="ctl" id="cancelReason" placeholder="취소 사유 (예: 수신처 오기재로 재발급)">' +
          '<button type="button" class="btn small" id="cancelBtn" style="background:var(--rose)">취소로 표시</button></div>' +
          '<p class="err hidden" id="cancelErr"></p></section>') +
      '</section>');
    bindLogout();
    document.getElementById('toLedger').addEventListener('click', function () { renderLedger(); scrollTop(); });
    var os = document.getElementById('openSrc');
    if (os) os.addEventListener('click', function () {
      if (r.sourceType === 'direct') openDirect(r.source, true); else { setOrg('tlc'); A.view = 'apps'; openDetail(r.source); }
    });
    bindPdfUpload(r.number, function () { r.hasFile = true; renderLedgerDetail(number); });
    var gp = document.getElementById('getPdf');
    if (gp) gp.addEventListener('click', function () {
      gp.disabled = true;
      run('adminLedgerFile', A.token, r.number).then(function (res) {
        var a = document.createElement('a'); a.href = res.dataUrl; a.download = res.name;
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(handleAdminError).then(function () { gp.disabled = false; });
    });
    var cb = document.getElementById('cancelBtn');
    if (cb) cb.addEventListener('click', function () {
      var reason = document.getElementById('cancelReason').value.trim();
      if (!reason) { showErr('cancelErr', '취소 사유를 적어 주세요.'); return; }
      if (cb.getAttribute('data-sure') !== '1') {
        cb.setAttribute('data-sure', '1'); cb.textContent = '한 번 더 누르면 취소됩니다';
        return;
      }
      cb.disabled = true; cb.textContent = '처리 중…';
      run('adminLedgerCancel', A.token, r.number, reason).then(function () {
        r.status = '취소';
        r.note = (r.note ? r.note + '\n' : '') + '[취소 ' + new Date().toISOString().slice(0, 10) + '] ' + reason;
        toast(r.number + ' 문서를 취소로 표시했습니다.');
        renderLedgerDetail(number);
      }).catch(function (err) { cb.disabled = false; cb.textContent = '취소로 표시'; cb.removeAttribute('data-sure'); handleAdminError(err); });
    });
  }

  // ── 발급본 PDF 올리기 (인쇄 화면 · 발급대장 공용) ─────
  function pdfUploadButton(replace) {
    return '<label class="btn ghost small file-btn">' + icon('file') + ' ' + (replace ? 'PDF 바꾸기' : '발급본 PDF 올리기') +
      '<input type="file" accept="application/pdf,.pdf" class="sr-only" id="pdfInput"></label>';
  }
  function bindPdfUpload(number, done) {
    var inp = document.getElementById('pdfInput');
    if (!inp || !number) return;
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var msg = document.getElementById('printMsg');
      var say = function (t, bad) { if (!msg) { toast(t); return; } msg.textContent = t; msg.style.color = bad ? 'var(--rose)' : ''; msg.classList.remove('hidden'); };
      if (!/\.pdf$/i.test(f.name)) { say('PDF 파일만 올릴 수 있습니다.', true); inp.value = ''; return; }
      if (f.size > 15 * 1024 * 1024) { say('15MB 이하의 PDF 파일을 올려 주세요.', true); inp.value = ''; return; }
      say('PDF를 올리는 중입니다…');
      readFile(f).then(function (att) {
        att.data = String(att.data).replace(/^data:[^;]*;/, 'data:application/pdf;');
        return run('adminLedgerUpload', A.token, number, att);
      }).then(function () {
        say('발급본 PDF를 드라이브에 저장하고 발급대장에 연결했습니다.');
        A.ledger.forEach(function (x) { if (x.number === number) x.hasFile = true; });
        if (done) done();
      }).catch(function (err) { if (!handleAdminError(err)) say(err.message, true); }).then(function () { inp.value = ''; });
    });
  }

  // ═════════════════════════════════════════════
  // 직접 발급 (온라인 신청 없이 관리자가 바로 작성하는 공문·승인서)
  // ═════════════════════════════════════════════
  function loadDirect() {
    A.view = 'direct';
    root.innerHTML = adminShell('<div class="loading">' + icon('loader', 'spin') + '&nbsp;문서 목록을 불러오는 중입니다…</div>');
    run('adminDirectList', A.token).then(function (res) {
      A.direct = res.documents; A.directCats = res.categories;
      renderDirectList();
    }).catch(function (err) { if (!handleAdminError(err)) { A.direct = []; renderDirectList(); } });
  }

  function renderDirectList() {
    root.innerHTML = adminShell(
      '<div class="detail-head"><div><p class="kicker">' + esc(issuerName(A.org)) + '</p><h1>직접 발급</h1>' +
      '<p class="help" style="margin:6px 0 0">' + esc(issuerName(A.org)) + ' 이름으로 바로 발급하는 공문·승인서를 작성합니다. 발급 확정하면 문서번호가 붙고 발급대장에 기록됩니다.</p></div>' +
      '<button type="button" class="btn small" id="newDoc">' + icon('file') + ' 새 문서 작성</button></div>' +
      '<div class="list" id="dlist"></div>');
    bindLogout();
    document.getElementById('newDoc').addEventListener('click', function () { openDirect(null); });
    var box = document.getElementById('dlist');
    var mine = A.direct.filter(function (d) { return (d.issuerKey || 'tlc') === A.org; });
    if (!mine.length) { box.innerHTML = '<div class="empty">아직 작성한 문서가 없습니다.</div>'; return; }
    box.innerHTML = mine.map(function (d) {
      var st = d.status === '작성 중' ? 's2' : d.status === '취소' ? 's3' : 's5';
      return '<button type="button" class="item" data-id="' + esc(d.id) + '"><span><strong>' + (d.number ? '<span class="docno">' + esc(d.number) + '</span> ' : '') + esc(d.title || '(제목 없음)') + '</strong>' +
        '<small>' + esc(d.category) + ' · ' + esc(d.recipient || '수신 미입력') + ' · ' + esc(d.updatedAt) + '</small></span>' +
        '<span class="st ' + st + '">' + esc(d.status) + '</span></button>';
    }).join('');
    box.querySelectorAll('[data-id]').forEach(function (b) { b.addEventListener('click', function () { openDirect(b.getAttribute('data-id')); }); });
  }

  function blankDirect() {
    var is = S.issuers[A.org];
    return { issuer: A.org, category: A.org === 'lm' ? '승인서' : '공문', heading: A.org === 'lm' ? '승인서' : '', docTitle: '', recipient: '', reference: '', subject: '', body: '',
      representativeTitle: is.representativeTitle, representative: is.representative, note: '' };
  }

  function openDirect(id, toPrint) {
    if (!id) { A.doc = { id: '', status: '작성 중', number: '', doc: blankDirect() }; renderDirectEditor(); return; }
    root.innerHTML = adminShell('<div class="loading">' + icon('loader', 'spin') + '&nbsp;문서를 불러오는 중입니다…</div>');
    run('adminDirectGet', A.token, id).then(function (res) {
      A.doc = res;
      if (res.doc && res.doc.issuer && res.doc.issuer !== A.org) setOrg(res.doc.issuer);
      if (toPrint || res.status !== '작성 중') renderDirectPrint(); else renderDirectEditor();
    }).catch(function (err) { if (!handleAdminError(err)) loadDirect(); });
  }

  function englishDirectFields() {
    return [['enHeading', '큰 제목 (영문)'], ['enRecipient', '수신 (영문)'], ['enReference', '참조 (영문)'],
      ['enSubject', '제목 (영문)'], ['enBody', '본문 (영문)'], ['enRepresentativeTitle', '대표자 직함 (영문)'], ['enRepresentative', '대표자 이름 (영문)']];
  }
  function missingEnglishDirect(d) {
    return englishDirectFields().filter(function (m) { return m[0] !== 'enReference' && !String(d[m[0]] || '').trim(); });
  }
  function renderDirectEditor() {
    var x = A.doc, d = x.doc, cats = A.directCats || ['증명서', '추천서', '승인서', '공문', '기타'];
    var f = function (key, label, ph, opt) {
      opt = opt || {};
      return '<label class="field' + (opt.full ? ' full' : '') + '"><span>' + esc(label) + (opt.req ? ' <b class="req">*</b>' : '') + '</span>' +
        (opt.area ? '<textarea class="ctl" data-k="' + key + '" rows="' + opt.area + '" placeholder="' + esc(ph || '') + '">' + esc(d[key] || '') + '</textarea>'
                  : '<input class="ctl" data-k="' + key + '" value="' + esc(d[key] || '') + '" placeholder="' + esc(ph || '') + '">') +
        (opt.help ? '<small style="font-weight:400;color:var(--muted)">' + esc(opt.help) + '</small>' : '') + '</label>';
    };
    root.innerHTML = adminShell(
      '<button type="button" class="back" id="toDirect">' + icon('left') + ' 직접 발급 목록</button>' +
      '<section class="panel" style="margin-top:10px">' +
        '<div class="detail-head"><div><p class="kicker">' + (x.id ? '문서 ID ' + esc(x.id) : '새 문서') + '</p><h1>공문 작성</h1>' +
        '<p class="help" style="margin:6px 0 0">문서번호와 시행일자는 발급 확정할 때 붙습니다.</p></div></div>' +
        '<div class="selected-doc"><span>발급 기관</span><strong>' + esc(issuerName(d.issuer)) + '</strong></div>' +
        '<div class="fsec" style="border-top:0;padding-top:4px"><div class="grid2">' +

  // 본문 꾸밈: "가." 소제목, "- " 목록, **굵게**
  function letterBody(text, closing) {
    var inline = function (t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); };
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var html = [], list = null, para = [];
    var flushPara = function () { if (para.length) { html.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    var flushList = function () { if (list) { html.push('<ul>' + list.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') + '</ul>'); list = null; } };
    lines.forEach(function (ln) {
      var t = ln.trim();
      if (!t) { flushPara(); flushList(); return; }
      var h = /^([가-하]\.|[0-9]+\.)\s*(.+)$/.exec(t);
      var b = /^[-•·]\s+(.+)$/.exec(t);
      if (b) { flushPara(); (list = list || []).push(b[1]); return; }
      flushList();
      if (h && t.length <= 60) { flushPara(); html.push('<h4><span>' + esc(h[1]) + '</span>' + inline(h[2]) + '</h4>'); return; }
      para.push(t);
    });
    flushPara(); flushList();
    if (closing) {
      var last = html.length - 1;
      if (last >= 0 && /<\/p>$/.test(html[last])) html[last] = html[last].replace(/<\/p>$/, '&nbsp;&nbsp;' + esc(closing) + '</p>');
      else html.push('<p>' + esc(closing) + '</p>');
    }
    return html.join('');
  }

  // 공문도 증명서와 같은 틀(머리글 · 큰 제목 · 표 · 서명 · 바닥글)을 씁니다
  function draftWatermark(en) {
    return '<div class="draft-watermark" aria-hidden="true">' + (en ? 'DRAFT FOR REVIEW' : '발급 전 확인용') + '</div>';
  }
  function draftNotice(en) {
    return '<p class="draft-notice">' + (en
      ? 'This document is for pre-issuance review only and has no official validity.<br>Please verify the final version bearing a document number, date of issue, and official seal.'
      : '※ 본 문서는 발급 전 확인용 문서로, 정식 발급 효력이 없습니다.<br>문서번호와 발급일자가 부여되고 직인이 포함된 최종본을 확인해 주시기 바랍니다.') + '</p>';
  }
  function englishLetterSheet(d, number) {
    var e = {};
    Object.keys(d).forEach(function (k) { e[k] = d[k]; });
    [['heading', 'enHeading'], ['recipient', 'enRecipient'], ['reference', 'enReference'], ['subject', 'enSubject'],
      ['body', 'enBody'], ['representativeTitle', 'enRepresentativeTitle'], ['representative', 'enRepresentative']]
      .forEach(function (p) { e[p[0]] = d[p[1]] || ''; });
    return letterSheet(e, number, true);
  }
  function letterSheet(d, number, en) {
    var key = d.issuer === 'lm' ? 'lm' : 'tlc', is = S.issuers[key] || S.issuers.tlc, oc = A.settings ? A.settings.outputCommon : null;
    var ap = S.appearance, size = esc(ap.logoSize || '18');

    var rows = [[en ? 'Date of Issue' : '시행일자', number ? (en ? todayEn() : dotDate(printDay())) : (en ? 'Assigned upon issuance' : '발급 확정일')], [en ? 'To' : '수신', d.recipient], [en ? 'Attention' : '참조', d.reference], [en ? 'Subject' : '제목', d.subject]]
      .filter(function (r) { return r[1]; });
    var foot = [is.address, is.phone, is.email].filter(Boolean);
    return '<article class="sheet letter"' + (en ? ' lang="en"' : ' lang="ko"') + '>' + (number ? '' : draftWatermark(en)) + '<header class="sheet-head">' + logo +
      '<div class="c"><strong>' + esc(is.name) + '</strong><p>' + esc(en ? '' : (is.subName || '')) + '</p></div>' +
      '<p class="r">' + esc(en ? 'Document No.' : (oc ? oc.documentNumberLabel : '문서번호')) + '<br><strong>' + (number ? esc(number) : '<span class="pending">' + (en ? 'Assigned upon issuance' : '발급 확정 시 부여') + '</span>') + '</strong></p></header>' +
      (d.heading ? '<h1 class="t compact">' + esc(d.heading) + '</h1>' : '') +
      '<div class="body compact' + (d.heading ? '' : ' no-title') + '">' + fieldTable(rows, true) +
        '<div class="lbody">' + letterBody(d.body || (en ? '[English version has not yet been entered.]' : ''), en ? '' : S.direct.closing) + '</div>' +
        '<div class="issuer lsign"><p class="date"><span>' + esc(en ? 'Date' : (oc ? oc.issueDateLabel : '발급일')) + '</span>' + (number ? (en ? todayEn() : todayKo()) : (en ? 'Assigned upon issuance' : '발급 확정일')) + '</p>' +
        '<div class="signer"><span>' + esc(is.name) + ' ' + esc(d.representativeTitle || (en ? '' : is.representativeTitle)) + '</span><strong>' + esc(d.representative || (en ? '' : is.representative)) + '</strong>' +
        seal(en ? 'Official\nSeal' : (oc ? oc.sealLabel : '직인\n위치')) + '</div></div>' +
      '</div>' +
      (!number ? draftNotice(en) : '') +
      (foot.length ? '<footer class="sheet-foot"><strong>' + esc(is.name) + '</strong> · ' + foot.map(esc).join(' · ') + '</footer>' : '') + '</article>';
  }
  function dotDate(d) { return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }

  // ── 출력 양식 (A4 인쇄·PDF 저장) ─────────────
  function renderPrint() {
    var d = A.detail, p = d.payload, type = p.documentType, st = A.settings;
    if (type === 'donation' && d.residentMasked !== '삭제됨') {
      root.innerHTML = '<div class="loading">' + icon('loader', 'spin') + '&nbsp;영수증을 준비하는 중입니다…</div>';
      run('adminRevealResident', A.token, d.reference).then(function (res) {
        drawPrint(res.residentNumber || '삭제됨');
      }).catch(function (err) { if (!handleAdminError(err)) renderDetail(); });
    } else {
      drawPrint(type === 'donation' ? '삭제됨' : '');

  function drawPrint(resident) {
    var d = A.detail, p = d.payload, type = p.documentType, st = A.settings;

    else if (REC_TYPES.indexOf(type) >= 0) sheet = recommendationSheet(type, p, st, d.documentNumber, en);

      (blocked ? '<small class="need">기부금액과 교회 고유번호(화면 문구 탭)를 입력해야 최종 발급할 수 있습니다.</small>'
       : warns.length ? '<small class="need">' + esc(warns.join(' · ')) + '</small>'

    document.getElementById('printBack').addEventListener('click', function () { PRINT_DATE = ''; renderDetail(); scrollTop(); });

  // 미리보기에서 알려 줄 빠진 내용
  function printWarnings(type, p, st, en) {
    var w = [];
    if (type === 'attendance' && !p.confirmedStart) w.push('확인된 출석 시작일을 입력해 주세요');
    if (CER_TYPES.indexOf(type) >= 0 && !p.confirmedDate) w.push('확인된 ' + (type === 'baptism' ? '침례일' : '헌아일') + '을 입력해 주세요');
    if (REC_TYPES.indexOf(type) >= 0 && !p.recommendationBody) w.push('추천서 본문을 작성해 주세요');
    if (en && enNeeds(type, p, st).some(function (n) { return !(p.en || {})[n.key]; })) w.push('영어로 옮겨 적지 않은 항목이 있습니다');
    return w;
  }

  var EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function enDate(v) {
    var m = /^(\d{4})-?(\d{2})-?(\d{2})$/.exec(String(v || ''));
    return m ? EN_MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : '';
  }
  function todayEn() { var d = printDay(); return EN_MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
  function dt(v) { return v ? koDate(v) : '-'; }

  // 출력 표의 항목: [키, 한글 값, 영문 자동 값 (null이면 관리자가 영어로 옮겨 적어야 함)]
  function printRows(type, p, st) {
    var birth = p.subjectBirthDate || p.birthDate;
    var rows = [['name', p.subjectName || p.applicantName || '', p.englishName || ''], ['birthDate', dt(birth), enDate(birth)]];
    var dept = p.affiliatedDepartment || '';
    if (type === 'attendance') {
      rows.push(['department', dept, null],
        ['period', p.confirmedStart ? koDate(p.confirmedStart) + ' ~ 현재' : (p.attendancePeriod || ''),
          p.confirmedStart ? enDate(p.confirmedStart) + ' ' + st.outputCommonEn.sinceSuffix : null],
        ['submissionTo', p.submissionTo || '', null], ['purpose', p.purpose || '', null]);
    } else if (type === 'membership') {
      rows.push(['department', p.registeredDepartment || dept, null], ['registrationDate', dt(p.registrationDate), enDate(p.registrationDate)],
        ['submissionTo', p.submissionTo || '', null], ['purpose', p.purpose || '', null]);
    } else if (CER_TYPES.indexOf(type) >= 0) {
      rows.push(['date', p.confirmedDate ? koDate(p.confirmedDate) : '', enDate(p.confirmedDate)], ['officiant', p.officiant || '', null],
        ['submissionTo', p.submissionTo || '', null], ['purpose', p.purpose || '', null]);
    } else if (REC_TYPES.indexOf(type) >= 0) {
      rows.push(['department', dept, null], ['applicationArea', p.applicationArea || '', null]);
    } else {
      var ko = type === 'employment' ? dt(p.employmentStart) + ' ~ 현재' : dt(p.employmentStart) + ' ~ ' + dt(p.employmentEnd);
      var e = type === 'employment' ? enDate(p.employmentStart) + ' ' + st.outputCommonEn.sinceSuffix : enDate(p.employmentStart) + ' – ' + enDate(p.employmentEnd);
      rows.push(['department', p.department || dept, null], ['position', p.position || '', null], ['period', ko, e],
        ['duties', p.duties || '', null], ['purpose', p.purpose || '', null]);
    }
    return rows;
  }

  // 영어로 옮겨 적어야 하는 항목 목록 (관리자 화면에 칸으로 나옵니다)
  function enNeeds(type, p, st) {
    var L = st.outputs[type].labels, out = [];
    printRows(type, p, st).forEach(function (r) {
      if (r[2] === null && r[1] && r[1] !== '-') out.push({ key: r[0], label: L[r[0]] || r[0], hint: r[1], full: r[0] === 'duties' });
    });
    if (REC_TYPES.indexOf(type) >= 0) {
      if (p.submissionTo) out.push({ key: 'submissionTo', label: '수신 기관', hint: p.submissionTo });
      if (type !== 'seniorPastor') {
        var signer = type === 'minister' ? p.ministerName : p.recommendingMember;
        if (signer) out.push({ key: 'signer', label: '서명자 이름', hint: signer });
      }
    }
    return out;
  }

  function tableRows(type, p, st, en) {
    var L = en ? st.outputsEn[type].labels : st.outputs[type].labels, E = p.en || {};
    return printRows(type, p, st).map(function (r) {
      var v = en ? (r[2] === null ? (E[r[0]] || (r[1] && r[1] !== '-' ? '' : '-')) : r[2]) : r[1];
      return [L[r[0]], v || '-'];
    });
  }

  function docSheet(st, number, title, compact, inner, en) {
    var C = en ? st.outputCommonEn : st.outputCommon, cert = st.certificate;
    return '<article class="sheet' + (en ? ' en' : '') + '">' + (number ? '' : draftWatermark(en)) + '<header class="sheet-head">' +
      (st.appearance.showLogo ? '<img src="' + LOGO + '" alt="" style="width:' + esc(st.appearance.logoSize) + 'mm;height:' + esc(st.appearance.logoSize) + 'mm" onerror="this.style.visibility=\'hidden\'">' : '<span></span>') +
      '<div class="c"><strong>' + esc(en ? cert.churchNameEn : st.brand.churchName) + '</strong><p>' + esc(en ? st.brand.churchName : st.brand.churchEnglish) + '</p></div>' +
      '<p class="r">' + esc(C.documentNumberLabel) + '<br><strong>' + (number ? esc(number) : '<span class="pending">' + (en ? 'Assigned on issue' : '발급 확정 시 부여') + '</span>') + '</strong></p></header>' +
      '<h1 class="t' + (compact ? ' compact' : '') + '">' + esc(title) + '</h1>' +
      '<div class="body' + (compact ? ' compact' : '') + '">' + inner + '</div>' +
      (number ? '' : draftNotice(en)) + '<footer class="sheet-foot"><strong>' + esc(en ? cert.churchNameEn : st.brand.churchName) + '</strong> · ' +
      esc(en ? cert.addressEn : cert.address) + ' · ' + esc(en ? cert.phoneEn : cert.phone) + '</footer></article>';
  }
  function fieldTable(rows, compact) {
    return '<dl class="ftable' + (compact ? ' compact' : '') + '">' + rows.map(function (r, i) {
      var b = i < rows.length - 1 ? ' class="b"' : '';
      return '<dt' + b + '>' + esc(r[0]) + '</dt><dd' + b + '>' + esc(r[1] || '-') + '</dd>';
    }).join('') + '</dl>';
  }
  function seal(label) { return '<span class="seal">' + esc(label) + '</span>'; }
  function issuer(st, en) {
    var C = en ? st.outputCommonEn : st.outputCommon;
    return '<div class="issuer"><p class="date"><span>' + esc(C.issueDateLabel) + '</span>' + (en ? todayEn() : todayKo()) + '</p>' +
      '<div class="signer"><span>' + (en ? 'Senior Pastor' : '담임목사') + '</span><strong>' + esc(en ? st.certificate.seniorPastorEn : st.certificate.seniorPastor) + '</strong>' + seal(C.sealLabel) + '</div></div>';
  }
  function validity(st, en) {
    var t = (en ? st.outputCommonEn : st.outputCommon).validityNote;
    return t ? '<p class="valid">' + esc(t) + '</p>' : '';
  }

  function standardSheet(type, p, st, number, en) {
    var tpl = en ? st.outputsEn[type] : st.outputs[type];
    return docSheet(st, number, tpl.title, false,
      fieldTable(tableRows(type, p, st, en)) + '<p class="statement">' + esc(tpl.statement) + '</p>' + issuer(st, en) + validity(st, en), en);
  }

  function recommendationSheet(type, p, st, number, en) {
    var tpl = en ? st.outputsEn[type] : st.outputs[type], E = p.en || {};
    var signerKo = type === 'seniorPastor' ? st.certificate.seniorPastor : type === 'minister' ? (p.ministerName || '') : (p.recommendingMember || '');
    var signer = en ? (type === 'seniorPastor' ? st.certificate.seniorPastorEn : (E.signer || '')) : signerKo;
    var body = p.recommendationBody || tpl.statement;
    var C = en ? st.outputCommonEn : st.outputCommon;
    var to = en ? esc(tpl.recipientPrefix) + ' ' + esc(E.submissionTo || p.submissionTo || '')
                : esc(p.submissionTo || '제출 기관') + ' ' + esc(tpl.recipientSuffix);
    return docSheet(st, number, tpl.title, true,
      '<p class="rec-to">' + to + '</p>' +
      fieldTable(tableRows(type, p, st, en)) +
      '<div class="rec-body">' + esc(body) + '</div>' +
      '<div class="issuer" style="margin-top:16mm"><p class="date">' + (en ? todayEn() : todayKo()) + '</p>' +
      '<div class="signer"><span>' + esc(tpl.signerLabel) + '</span><strong>' + esc(signer) + '</strong>' +
      seal(type === 'memberRecommendation' ? C.signatureSealLabel : C.sealLabel) + '</div></div>', en);
  }

  function donationSheet(p, st, number, resident) {
    var tpl = st.outputs.donation, L = tpl.labels, Sx = tpl.sections;
    var amount = p.donationAmount ? Number(p.donationAmount).toLocaleString('ko-KR') + '원' : '관리자 입력 필요';
    return docSheet(st, number, tpl.title, true,
      '<section class="don"><h2>' + esc(Sx.donor) + '</h2>' +
      fieldTable([[L.name, p.donorName || p.applicantName || '-'], [L.residentNumber, resident || '-'], [L.address, p.registeredAddress || '-']], true) +
      '<h2 class="gap">' + esc(Sx.donation) + '</h2>' +
      fieldTable([[L.taxYear, p.taxYear || '-'], [L.period, p.donationPeriod || '관리자 입력 필요'], [L.donationType, p.donationType || '종교단체 기부금'], [L.amount, amount]], true) +
      '<h2 class="gap">' + esc(Sx.organization) + '</h2>' +
      fieldTable([[L.organizationName, st.brand.churchName], [L.organizationNumber, st.certificate.organizationNumber || '관리자 입력 필요'],
        [L.organizationAddress, st.certificate.address], [L.representative, st.certificate.seniorPastor], [L.phone, st.certificate.phone]], true) +
      '</section><p class="statement" style="margin-top:12mm;font-size:11.5pt">' + esc(tpl.statement) + '</p>' + issuer(st, false));
  }

  // ── 시작 ─────────────────────────────────────
  function start() {
    run('getPublicSettings').then(function (res) {
      S = res.settings;
      applyColors();
      if (BOOT.mode === 'admin') startAdmin(); else renderPublic();
    }).catch(function (err) {
      root.innerHTML = '<div class="loading" style="padding:20px;text-align:center">' + esc(err.message) +
        '<br><button type="button" class="btn" style="margin-top:16px" onclick="location.reload()">다시 불러오기</button></div>';
    });
  }
  start();
})();
</script>
</body>
</html>
